      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          python -m pip install --upgrade pip
          pip install pytest

      - name: Build & Test
        working-directory: hw/lab02/04_cmake_flags_version
        run: pytest tests -v

  lab02-googletest:
    name: "Lab 02: 05 – GoogleTest Integration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          python -m pip install --upgrade pip
          pip install pytest

      - name: Build & Test
        working-directory: hw/lab02/05_googletest
        run: pytest tests -v

  lab03-alignment:
    name: "Lab 03: 01 – Address Alignment"
    runs-on: ubuntu-latest
    # needs + always() выносят задание дз3 в отдельный блок на графе:
    # оно стартует после заданий lab02 и выполняется, даже если они упали.
    needs:
      - lab02-separate-compilation
      - lab02-auto-deps
      - lab02-debug-release
      - lab02-cmake-flags-version
      - lab02-googletest
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

