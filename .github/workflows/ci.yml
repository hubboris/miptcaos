  lab04-minmax:
    name: "Lab 04: 01 – Min & Max from Arguments"
    runs-on: ubuntu-latest
    # needs на все задания lab03 + always() выносят задание дз4 в отдельный
    # (третий) блок на графе: оно стартует после lab03 и не зависит от их результата.
